<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="sfti-token" content="__SFTI_TOKEN__">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salesforce Ticket Investigator</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#ffffff;--ink:#1c1b19;--muted:#6a675f;--line:#e3dfd6;--soft:#efece5;
  --accent:#0b6e4f;--accent-ink:#ffffff;--accent-soft:#e2f2ea;
  --warn:#9a5b00;--warn-soft:#fbefd6;--bad:#a8322b;--bad-soft:#fbe5e2;--info:#1f5fa8;--info-soft:#e3eefb;
  --code:#f1eee7;--add:#e1f4e7;--del:#fbe4e1;--shadow:0 1px 2px rgba(20,18,12,.06),0 6px 20px rgba(20,18,12,.05);
  --radius:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412;--panel:#1d1d1a;--ink:#eceae4;--muted:#a19e95;--line:#33322d;--soft:#252521;
  --accent:#5fd0a5;--accent-ink:#0c1f17;--accent-soft:#173326;
  --warn:#f0b75a;--warn-soft:#3a2c12;--bad:#f08a80;--bad-soft:#3f1f1c;--info:#8ab8f0;--info-soft:#17293f;
  --code:#262622;--add:#16351f;--del:#40201d;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 16px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.brand b{display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--soft)}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:0 8px}
.side-foot{display:grid;gap:8px;padding:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--panel);white-space:nowrap}
.chip.ok{color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.chip.warn{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.chip.bad{color:var(--bad);border-color:transparent;background:var(--bad-soft)}
.chip.info{color:var(--info);border-color:transparent;background:var(--info-soft)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
main{padding:30px clamp(16px,4vw,44px) 80px;max-width:1120px;width:100%;min-width:0}
h1{overflow-wrap:anywhere}
h1{font-size:1.65rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:1.08rem;margin:0 0 10px}
h3{font-size:.98rem;margin:18px 0 6px}
.lead{color:var(--muted);margin:0 0 24px;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.card.flat{box-shadow:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:550;text-decoration:none;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:6px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
label{font-weight:550;font-size:13.5px;display:block;margin:0 0 5px}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:9px 11px}
textarea{min-height:300px;resize:vertical;font:13.5px/1.5 var(--mono)}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field{margin-bottom:14px}
code,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--code);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.cmd{display:flex;gap:8px;align-items:stretch;background:var(--code);border-radius:9px;padding:8px 8px 8px 12px;margin:6px 0;font:13px/1.5 var(--mono)}
.cmd span{flex:1;overflow-wrap:anywhere;white-space:pre-wrap;align-self:center}
.step{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px}
.step .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--muted);background:var(--panel)}
.step.done .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.todo .num{border-color:var(--warn);color:var(--warn)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.mark-ok{color:var(--accent)}.mark-bad{color:var(--bad)}.mark-warn{color:var(--warn)}.mark-wait{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-top:0;font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tablewrap{overflow-x:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-weight:550;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.feed{list-style:none;margin:0;padding:0;max-height:440px;overflow:auto}
.feed li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:6px 0;font-size:14px}
.feed .d{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.feed .note{color:var(--muted);font-style:italic}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:14px}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--accent-soft);color:var(--accent)}
.verdict{display:grid;gap:10px}
.verdict .big{font-size:1.12rem;line-height:1.45}
.verdict .big p{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:1.5rem;line-height:1.1}
.tile span{color:var(--muted);font-size:13px}
.prose h1{font-size:1.3rem}.prose h2{font-size:1.05rem;margin-top:22px;padding-top:12px;border-top:1px solid var(--line)}
.prose h2:first-child{border-top:0;padding-top:0;margin-top:0}
.prose p{margin:9px 0}.prose ul,.prose ol{padding-left:22px}.prose li{margin:3px 0}
.prose pre{background:var(--code);padding:12px;border-radius:9px;overflow-x:auto;font:12.5px/1.5 var(--mono)}
.prose pre code{background:none;padding:0}
.prose table{font-size:13.5px;margin:10px 0;display:block;overflow-x:auto}
.prose td,.prose th{border:1px solid var(--line)}
.prose th{background:var(--soft);text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.prose td:has(>code:only-child){min-width:15rem}
.prose blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;color:var(--muted)}
.prose .add{background:var(--add);display:block}.prose .del{background:var(--del);display:block}.prose .hunk{color:var(--muted);display:block}
pre.diff{background:var(--code);padding:12px;border-radius:9px;overflow-x:auto;font:12.5px/1.5 var(--mono);margin:0}
pre.diff .add{background:var(--add);display:block}pre.diff .del{background:var(--del);display:block}
pre.diff .hunk,pre.diff .file{color:var(--muted);display:block}
pre.plain{white-space:pre-wrap;background:var(--code);padding:12px;border-radius:9px;font:13px/1.5 var(--mono);margin:0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{cursor:pointer;font-weight:550}
.note-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.note-card.stale{border-color:var(--warn)}
textarea.short{min-height:92px;font:inherit}
select.inline{width:auto;padding:5px 9px;font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap}
.hit{border-top:1px solid var(--line);padding:9px 0}.hit:first-child{border-top:0}
.meter:empty{display:none}
.meter{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.4;background:var(--panel);display:grid;gap:7px;margin:auto 0 4px}
.meter .m-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter .m-row{display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px;align-items:baseline}
.meter .m-k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.meter .m-big{font-size:15px;font-weight:650}
.meter .m-plan{display:grid;gap:6px}
.meter .m-win-head{display:flex;justify-content:space-between;gap:6px}
.meter .m-bar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:2px}
.meter .m-bar i{display:block;height:100%;background:var(--accent)}
.meter .m-bar i.warn{background:var(--warn)}.meter .m-bar i.bad{background:var(--bad)}
.meter .m-sub{color:var(--muted);font-size:11.5px}
.meter .warn{color:var(--warn);font-weight:650}.meter .bad{color:var(--bad);font-weight:700}
.meter details{border:0;padding:0}.meter summary{font-weight:500;color:var(--muted);font-size:11.5px}
.meter .m-toggle{display:none;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;padding:0 2px}
.meter .m-pill{display:none}
.saving{display:grid;gap:6px;margin:2px 0 14px}
label.check{display:inline-flex;gap:8px;align-items:center;margin:0;cursor:pointer}
label.inline{display:inline-flex;gap:6px;align-items:center;margin:0;font-weight:500}
input[type=number]{width:96px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:5px 8px}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--panel);color:var(--accent);padding:8px 12px;border-radius:9px;border:1px solid var(--line)}
.skip:focus{left:8px}
main:focus{outline:none}
@media (max-width:860px){
  .meter{position:fixed;right:12px;bottom:12px;z-index:40;width:min(300px,calc(100vw - 24px));margin:0;box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .meter .m-toggle{display:inline-flex}
  .meter.compact{width:auto;padding:0;border-radius:999px;gap:0}
  .meter.compact > :not(.m-pill){display:none}
  .meter.compact .m-pill{display:inline-flex;gap:8px;align-items:center;border:0;background:transparent;padding:7px 14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 6px 0 0}.brand small{display:none}
  nav{display:flex;flex-wrap:wrap;gap:2px 4px;flex:1 1 100%;min-width:0;margin:6px 0 0}nav a{white-space:nowrap;padding:6px 9px}nav a .n{display:none}
  .side-foot{display:none}.grid2{grid-template-columns:1fr}
  main{padding:20px 16px 84px}
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to content</a>
<div class="app">
  <aside>
    <div class="brand"><div class="mark">TI</div><div><b>Ticket Investigator</b><small>Salesforce · root cause with evidence</small></div></div>
    <nav id="nav" aria-label="Main">
      <a href="#/start" data-view="start">Get started</a>
      <a href="#/new" data-view="new">New ticket</a>
      <a href="#/tickets" data-view="tickets">Tickets <span class="n" id="nav-count" aria-label="0 tickets">0</span></a>
      <a href="#/memory" data-view="memory">Org memory</a>
      <a href="#/safety" data-view="safety">How it stays safe</a>
    </nav>
    <div class="meter compact" id="meter" aria-live="polite"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="static/app.js"></script>
</body>
</html>
