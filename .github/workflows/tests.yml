name: tests

# The suite needs no Salesforce org and no Salesforce CLI: it runs against the simulated org in simulator/.
#
# Each push runs two jobs: Windows on Python 3.11 and macOS on Python 3.13, so both supported systems and
# both Python versions are covered. On a private repository macOS minutes count ten times and Windows
# minutes twice against the monthly allowance; all four combinations cost about 126 minutes a push.
# "Run workflow" (by hand, in the Actions tab) runs all four, for example before a release.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch replaces a run that is still going.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"os":["windows-latest","macos-latest"],"python":["3.11","3.13"]}' || '{"include":[{"os":"windows-latest","python":"3.11"},{"os":"macos-latest","python":"3.13"}]}') }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      # Builds the release zip, unpacks it into an empty folder and runs its own start script for this system:
      # private environment, install, and the page answering on the simulated orgs.
      - name: The release zip sets itself up from nothing
        run: python scripts/check_release.py
