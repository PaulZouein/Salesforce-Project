name: tests

# The suite needs no Salesforce org and no Salesforce CLI: it runs against the simulated org in simulator/.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]  # the supported systems
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      # Builds the release zip, unpacks it into an empty folder and runs its own start script for this system:
      # private environment, install, and the page answering on the simulated orgs.
      - name: The release zip sets itself up from nothing
        run: python scripts/check_release.py
