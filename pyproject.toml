[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-ticket-investigator"
version = "0.1.0"
description = "Investigate Salesforce bug tickets with evidence: root cause, smallest fix, verified in a sandbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10", "pypdf>=4.0"]
keywords = ["salesforce", "claude-code", "mcp", "debugging", "root-cause-analysis", "apex"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/PaulZouein/Salesforce-Project"
Documentation = "https://github.com/PaulZouein/Salesforce-Project#readme"
Issues = "https://github.com/PaulZouein/Salesforce-Project/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sfti-prereqs = "core.prereqs:main"
sfti-mcp = "mcp_server.server:main"
sfti-web = "webapp.__main__:main"

[tool.setuptools]
packages = ["core", "mcp_server", "simulator", "webapp"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
